[project]
name = "transit"
version = "0.1.0"
description = ""
authors = [
    {name = "anyad154",email = "ann.dyadyk@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pandas (>=3.1.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.poetry]
packages = [{ include = "transit", from = "src" }]